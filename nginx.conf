# Reverse proxy for the Docker deployment described in README.md.
#
# Single-port production mode: the Node server serves the built frontend, the API
# and Socket.IO all on 127.0.0.1:1118, so one `location /` covers everything
# (including the /socket.io websocket upgrade).
#
# If you run Nginx Proxy Manager instead of plain nginx, this file is reference
# rather than drop-in — but the same three things still have to be true there:
# forward the websocket upgrade, send X-Forwarded-For, and set TRUST_PROXY=1 in
# the server's .env so rate limiting keys on the real client IP.

# Only upgrade the connection when the client actually asked for it. A hardcoded
# `Connection: upgrade` claims an upgrade on every plain HTTP request too, which
# breaks keepalive to the backend.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# Rate-limit zones. The application has its own per-IP limits, but those only
# help once a request reaches Node; these cap what gets that far.
limit_req_zone  $binary_remote_addr zone=vertix_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=vertix_conn:10m;

server {
	listen 80;
	listen [::]:80;
	server_name vertix.vestiges.tech;

	# Redirect HTTP -> HTTPS (certbot/Let's Encrypt manages the 443 block below).
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name vertix.vestiges.tech;

	ssl_certificate     /etc/letsencrypt/live/vertix.vestiges.tech/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/vertix.vestiges.tech/privkey.pem;

	# Don't inherit whatever the distro default happens to be.
	ssl_protocols             TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache         shared:SSL:10m;
	ssl_session_timeout       1d;
	ssl_session_tickets       off;

	# The app sets its own CSP, X-Frame-Options and friends (see server/index.ts).
	# HSTS belongs here as well so it is present even on responses nginx serves
	# itself, such as an error page when the backend is down.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	server_tokens off;

	# Custom map uploads are bounded at 150KB by the app's bodyLimit; nginx's 1MB
	# default is the outer bound.
	client_max_body_size 1m;

	limit_conn vertix_conn 50;

	location / {
		limit_req zone=vertix_api burst=60 nodelay;

		proxy_pass http://127.0.0.1:1118;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Socket.IO needs the websocket upgrade to pass through.
		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		# Long-lived only for the websocket; a 24h read timeout on ordinary
		# requests is a slowloris invitation.
		proxy_read_timeout 75s;
		proxy_send_timeout 75s;
	}

	# The websocket carries continuous gameplay traffic, so it needs both a long
	# timeout and an exemption from the per-request rate limit.
	location /socket.io/ {
		limit_conn vertix_conn 50;

		proxy_pass http://127.0.0.1:1118;
		proxy_http_version 1.1;

		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
	}
}
